name: CI

# NOT run on push or pull_request — deliberately off by default.
#
# Every gate here also runs locally, and faster:
#   npm run typecheck:ci   npm run lint:ci
#   npm run build          npm run test:auth   npm run smoke
#
# So this is a periodic safety net, not the first line of defence. Run it
# by hand from the Actions tab whenever it matters (before a merge to
# main, for instance) — that is what workflow_dispatch is for.
#
# THE TRADE-OFF, STATED PLAINLY
#   With no push or pull_request trigger:
#     · broken commits can land on develop unchecked for up to 2 days
#     · these are NOT PR checks, so branch protection cannot require
#       them — GitHub can only require a check that gets created
#     · anything claiming "CI is blocking" is wrong while this is so
#
#   That is a deliberate cost decision, not an oversight. It is fine
#   while develop deploys nowhere users reach.
#
#   BEFORE MERGING TO main, run the full set by hand — either locally,
#   or from the Actions tab against the branch being merged. The
#   pre-merge gate is a person, not a robot, until the triggers come
#   back.
on:
  schedule:
    # 03:00 UTC on odd days of the month — roughly every 2 days.
    # (Cron cannot express "every 48 hours"; day-of-month */2 is the
    # standard approximation and gives a 1-day gap across month ends.)
    - cron: "0 3 */2 * *"

  # Manual runs, from the Actions tab. Pick the branch there.
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run checks out the default branch, which is main —
          # currently many commits behind. The work is on develop, so test
          # that unless a manual run picked something else.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is bare `vite build` and does NOT typecheck.
      - name: Build
        run: npm run build
        env:
          # Vite needs these at build time or src/lib/supabase.ts throws on
          # import. Values are irrelevant to a build — nothing connects.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_URL: https://staging.ysrcpnriwing.org

  # BLOCKING, unlike the advisory job this replaces.
  #
  # That job ran bare `npx tsc --noEmit`, which in this repo checks NOTHING:
  # the root tsconfig.json is `"files": []` with project references only, so
  # tsc has no inputs and always exits 0. It reported green on a Dashboard
  # using <AbroadConnect /> with no import at all — and `vite build` bundled
  # it happily, because Vite strips types without checking them. That would
  # have shipped as a white screen on the Connect tab.
  #
  # Making `build` run tsc first is not an option: the repo carries 117
  # inherited errors and every deploy would fail. So the gate is a budget —
  # the count may not RISE. New errors block; old ones are tolerated until
  # someone clears them, at which point the baseline drops.
  typecheck:
    name: Typecheck (no new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run checks out the default branch, which is main —
          # currently many commits behind. The work is on develop, so test
          # that unless a manual run picked something else.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: No new type errors
        run: npm run typecheck:ci

  # BLOCKING. ESLint could not run at all until typescript-eslint was
  # upgraded — eslint 9.39 crashed loading a rule from the 8.8 plugin —
  # so "lint passes" had never been true either way. Same budget shape
  # as typecheck: 291 inherited problems tolerated, anything new fails.
  lint:
    name: Lint (no new problems)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run checks out the default branch, which is main —
          # currently many commits behind. The work is on develop, so test
          # that unless a manual run picked something else.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: No new lint problems
        run: npm run lint:ci

  # Authorization and member-journey tests need a live database, so they
  # run only where the staging secrets exist. They are the two suites
  # that would have caught the review's findings: auth-matrix for the
  # privilege escalation, smoke for the redirect loop and the data
  # erasure. Skipped rather than failed on a fork PR with no secrets.
  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A scheduled run checks out the default branch, which is main —
          # currently many commits behind. The work is on develop, so test
          # that unless a manual run picked something else.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env.local from secrets
        run: |
          # Scheduled and manual runs only, both from this repo — there is
          # no fork case to tolerate any more. A missing secret must FAIL:
          # a green "Database tests" check that ran nothing is worse than
          # a red one, because it is believed.
          if [ -z "${{ secrets.STAGING_SUPABASE_URL }}" ]; then
            echo "::error::STAGING_SUPABASE_URL is not set. Database tests cannot run."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\n' "${{ secrets.STAGING_SUPABASE_URL }}" > .env.local
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "${{ secrets.STAGING_SUPABASE_ANON_KEY }}" >> .env.local
      - name: Authorization matrix
        run: npm run test:auth
      - name: Member journey
        run: npm run smoke
