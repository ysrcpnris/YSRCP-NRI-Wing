name: CI

# Runs on every PR into develop or main. Until this existed, nothing checked a
# change before it reached production — Vercel simply deployed whatever landed
# on main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is bare `vite build` and does NOT typecheck.
      - name: Build
        run: npm run build
        env:
          # Vite needs these at build time or src/lib/supabase.ts throws on
          # import. Values are irrelevant to a build — nothing connects.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_URL: https://staging.ysrcpnriwing.org

  # BLOCKING, unlike the advisory job this replaces.
  #
  # That job ran bare `npx tsc --noEmit`, which in this repo checks NOTHING:
  # the root tsconfig.json is `"files": []` with project references only, so
  # tsc has no inputs and always exits 0. It reported green on a Dashboard
  # using <AbroadConnect /> with no import at all — and `vite build` bundled
  # it happily, because Vite strips types without checking them. That would
  # have shipped as a white screen on the Connect tab.
  #
  # Making `build` run tsc first is not an option: the repo carries 117
  # inherited errors and every deploy would fail. So the gate is a budget —
  # the count may not RISE. New errors block; old ones are tolerated until
  # someone clears them, at which point the baseline drops.
  typecheck:
    name: Typecheck (no new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: No new type errors
        run: npm run typecheck:ci
